suite:
  id: ims_invite_rfc_invalid_sip_version
  title: INVITE RFC robustness - invalid SIP version
  default_timeout_seconds: 6.0

tests:
  - id: invite_invalid_sip_version
    description: Corrupt start-line SIP version from SIP/2.0 to SIP/2.1
    message:
      type: INVITE
      template: |
        INVITE tel:9076543210;phone-context=ims.mnc001.mcc001.3gppnetwork.org SIP/2.0
        Via: SIP/2.0/UDP 192.0.2.100:5060;branch=z9hG4bK-rfc-ver-1
        Max-Forwards: 70
        From: <sip:bob@example.com>;tag=robust-version
        To: <sip:alice@example.com>
        Call-ID: rfc-ver-1@tester
        CSeq: 1 INVITE
        Contact: <sip:bob@192.0.2.100:5060>
        Content-Type: application/sdp
        Content-Length: 133

        v=0
        o=- 4 4 IN IP4 192.0.2.100
        s=IMS-Robustness
        c=IN IP4 192.0.2.100
        t=0 0
        m=audio 49170 RTP/AVP 0
        a=rtpmap:0 PCMU/8000
      edits:
        - target: start_line
          action: set
          value: INVITE tel:9076543210;phone-context=ims.mnc001.mcc001.3gppnetwork.org SIP/2.1
      repeat:
        count: 1
        rate_per_second: 1.0

    expected_response: {}
