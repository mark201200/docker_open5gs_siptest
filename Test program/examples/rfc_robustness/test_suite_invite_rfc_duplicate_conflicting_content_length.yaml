suite:
  id: ims_invite_rfc_duplicate_conflicting_content_length
  title: INVITE RFC robustness - duplicate conflicting Content-Length
  default_timeout_seconds: 6.0

tests:
  - id: invite_duplicate_conflicting_content_length
    description: Include two Content-Length headers with different values
    message:
      type: INVITE
      template: |
        INVITE sip:alice@example.com SIP/2.0
        Via: SIP/2.0/UDP 192.0.2.100:5060;branch=z9hG4bK-rfc-dupe-cl-1
        Max-Forwards: 70
        From: <sip:bob@example.com>;tag=robust-dupe-cl
        To: <sip:alice@example.com>
        Call-ID: rfc-dupe-cl-1@tester
        CSeq: 1 INVITE
        Contact: <sip:bob@192.0.2.100:5060>
        Content-Type: application/sdp
        Content-Length: 133
        Content-Length: 8

        v=0
        o=- 5 5 IN IP4 192.0.2.100
        s=IMS-Robustness
        c=IN IP4 192.0.2.100
        t=0 0
        m=audio 49170 RTP/AVP 0
        a=rtpmap:0 PCMU/8000
      repeat:
        count: 1
        rate_per_second: 1.0

    expected_response: {}
