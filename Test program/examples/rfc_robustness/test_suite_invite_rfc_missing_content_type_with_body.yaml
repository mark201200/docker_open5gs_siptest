suite:
  id: ims_invite_rfc_missing_content_type_with_body
  title: INVITE RFC robustness - missing Content-Type with non-empty body
  default_timeout_seconds: 6.0

tests:
  - id: invite_missing_content_type_with_body
    description: Remove Content-Type while keeping non-empty SDP-like body
    message:
      type: INVITE
      template: |
        INVITE sip:alice@example.com SIP/2.0
        Via: SIP/2.0/UDP 192.0.2.100:5060;branch=z9hG4bK-rfc-miss-ct-1
        Max-Forwards: 70
        From: <sip:bob@example.com>;tag=robust-miss-ct
        To: <sip:alice@example.com>
        Call-ID: rfc-miss-ct-1@tester
        CSeq: 1 INVITE
        Contact: <sip:bob@192.0.2.100:5060>
        Content-Type: application/sdp
        Content-Length: 133

        v=0
        o=- 2 2 IN IP4 192.0.2.100
        s=IMS-Robustness
        c=IN IP4 192.0.2.100
        t=0 0
        m=audio 49170 RTP/AVP 0
        a=rtpmap:0 PCMU/8000
      edits:
        - target: header
          action: remove
          field: Content-Type
      repeat:
        count: 1
        rate_per_second: 1.0

    expected_response: {}
