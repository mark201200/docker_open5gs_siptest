route[IMS_FUZZ] {

    $ru = "sip:9076543211@ims.mnc001.mcc001.3gppnetwork.org";

    $var(rand) = $RANDOM;

    $var(tmp) = $(var(tmp){s.int});

	if ($var(tmp) < 1073741824) {
		$var(rand) = 0;
	} else if ($var(tmp) < 2147483648) {
		$var(rand) = 1;
	} else if ($var(tmp) < 3221225472) {
		$var(rand) = 2;
	} else {
		$var(rand) = 3;
	}

    $uac_req(method)="INVITE";
    $uac_req(ruri)=$ru;
    $uac_req(furi)="sip:fuzzer@ims.mnc001.mcc001.3gppnetwork.org";
    $uac_req(turi)=$ru;
    $uac_req(callid)="fuzz-" + $RANDOM;

    if ($var(rand)==0) {
        $uac_req(hdrs)="Require: weird-feature\r\n";
    }
    if ($var(rand)==1) {
        $uac_req(hdrs)="Max-Forwards: 0\r\n";
    }
    if ($var(rand)==2) {
        $uac_req(hdrs)="CSeq: 999999999 INVITE\r\n";
    }
    if ($var(rand)==3) {
        $uac_req(hdrs)="Content-Length: 1\r\n";
        $uac_req(body)="LONG_BODY_THAT_DOES_NOT_MATCH";
    }

    uac_req_send();
}

######################################################################
# manage failure routing cases, perform failover
######################################################################
failure_route[TRF_failure] {
	xlog("TRF_failure\n");
	# Choose another gateway, in case we
	# - get a local generated "408"
	# - receive a 5xx or 6xx reply from the proxy.
	if (t_branch_timeout() || t_check_status("[5-6]..")) {
		$du = $null;
		if (!ds_select_domain("1", "4")) {
			xlog("L_WARN","No PSTN-Gateways available - M=$rm R=$ru F=$fu T=$tu IP=$si:$sp ID=$ci\n\n");
			send_reply("503", "Service not available");
			exit;
		}
		if (!strempty($(ou{uri.params}))) {
			$ru = $ru+";"+$(ou{uri.params});
		}
		# Relay the request:
		t_on_failure("PSTN_failure");

		t_relay();
		exit;
	}
}

