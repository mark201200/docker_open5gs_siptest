suite:
  id: ims_invite_intercept_only_user_agent_test
  title: Intercept-only INVITE rewrite to User-Agent TEST
  default_timeout_seconds: 30.0

tests:
  - id: invite_intercept_only_switch_user_agent_to_test
    description: Wait for live INVITE traffic and rewrite User-Agent to TEST
    message:
      type: INVITE
      intercept_only: true
      intercept_message_type: INVITE
      intercept_direction: any
      intercept_wait_timeout_seconds: 30.0
      intercept_edits:
        - target: header
          action: set
          field: User-Agent
          value: TEST
      repeat:
        count: 1
        rate_per_second: 1.0

    expected_response: {}
