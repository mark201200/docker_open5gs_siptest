suite:
  id: ai_send_register_malformed_matrix
  title: AI malformed REGISTER send matrix
  default_timeout_seconds: 8.0

tests:
  - id: ai_register_malformed_from_uri
    description: REGISTER with malformed From URI and missing closing bracket on IMS-like baseline
    message:
      type: REGISTER
      template: |
        REGISTER sip:ims.mnc001.mcc001.3gppnetwork.org SIP/2.0
        Via: SIP/2.0/TCP 192.168.101.3:41067;branch=z9hG4bK-ai-reg-1
        Max-Forwards: 70
        From: <sip:broken-user@ims.mnc001.mcc001.3gppnetwork.org;tag=ai-reg-1
        To: <sip:$PHONE@ims.mnc001.mcc001.3gppnetwork.org>
        Call-ID: ai-reg-1_2329272412@192.168.101.3
        CSeq: 1 REGISTER
        Contact: <sip:$PHONE@192.168.101.3:41067>
        Expires: 0
        Security-Verify: ipsec-3gpp;q=0.1;prot=esp;mod=trans;spi-c=4098;spi-s=4099;port-c=5101;port-s=6101;alg=hmac-sha-1-96;ealg=null
        Proxy-Require: sec-agree
        Require: sec-agree
        Content-Length: 0
      repeat:
        count: 1
        rate_per_second: 1.0
    expected_response: {}

  - id: ai_register_cseq_method_mismatch
    description: REGISTER with CSeq method changed to INVITE while keeping routable identity
    message:
      type: REGISTER
      template: |
        REGISTER sip:ims.mnc001.mcc001.3gppnetwork.org SIP/2.0
        Via: SIP/2.0/TCP 192.168.101.3:41067;branch=z9hG4bK-ai-reg-2
        Max-Forwards: 70
        From: <sip:$PHONE@ims.mnc001.mcc001.3gppnetwork.org>;tag=ai-reg-2
        To: <sip:$PHONE@ims.mnc001.mcc001.3gppnetwork.org>
        Call-ID: ai-reg-2_2329272412@192.168.101.3
        CSeq: 2 REGISTER
        Contact: <sip:$PHONE@192.168.101.3:41067>
        Expires: 0
        Security-Verify: ipsec-3gpp;q=0.1;prot=esp;mod=trans;spi-c=4098;spi-s=4099;port-c=5101;port-s=6101;alg=hmac-sha-1-96;ealg=null
        Proxy-Require: sec-agree
        Require: sec-agree
        Content-Length: 0
      edits:
        - target: header
          action: set
          field: CSeq
          value: 2 INVITE
      repeat:
        count: 1
        rate_per_second: 1.0
    expected_response: {}

  - id: ai_register_body_with_short_content_length
    description: REGISTER with non-empty body but very short Content-Length on IMS-like baseline
    message:
      type: REGISTER
      template: |
        REGISTER sip:ims.mnc001.mcc001.3gppnetwork.org SIP/2.0
        Via: SIP/2.0/TCP 192.168.101.3:41067;branch=z9hG4bK-ai-reg-3
        Max-Forwards: 70
        From: <sip:$PHONE@ims.mnc001.mcc001.3gppnetwork.org>;tag=ai-reg-3
        To: <sip:$PHONE@ims.mnc001.mcc001.3gppnetwork.org>
        Call-ID: ai-reg-3_2329272412@192.168.101.3
        CSeq: 3 REGISTER
        Contact: <sip:$PHONE@192.168.101.3:41067>
        Expires: 0
        Security-Verify: ipsec-3gpp;q=0.1;prot=esp;mod=trans;spi-c=4098;spi-s=4099;port-c=5101;port-s=6101;alg=hmac-sha-1-96;ealg=null
        Proxy-Require: sec-agree
        Require: sec-agree
        Content-Type: application/json
        Content-Length: 4

        {"rogue":"this body is intentionally longer than 4 bytes"}
      repeat:
        count: 1
        rate_per_second: 1.0
    expected_response: {}

  - id: ai_register_burst_invalid_contact
    description: Burst malformed REGISTER Contact values on IMS-like baseline to probe parser lockups
    message:
      type: REGISTER
      template: |
        REGISTER sip:ims.mnc001.mcc001.3gppnetwork.org SIP/2.0
        Via: SIP/2.0/TCP 192.168.101.3:41067;branch=z9hG4bK-ai-reg-4
        Max-Forwards: 70
        From: <sip:$PHONE@ims.mnc001.mcc001.3gppnetwork.org>;tag=ai-reg-4
        To: <sip:$PHONE@ims.mnc001.mcc001.3gppnetwork.org>
        Call-ID: ai-reg-4_2329272412@192.168.101.3
        CSeq: 4 REGISTER
        Contact: sip::::::invalid::::::
        Expires: 0
        Security-Verify: ipsec-3gpp;q=0.1;prot=esp;mod=trans;spi-c=4098;spi-s=4099;port-c=5101;port-s=6101;alg=hmac-sha-1-96;ealg=null
        Proxy-Require: sec-agree
        Require: sec-agree
        Content-Length: 0
      repeat:
        count: 30
        rate_per_second: 6.0
    expected_response: {}
