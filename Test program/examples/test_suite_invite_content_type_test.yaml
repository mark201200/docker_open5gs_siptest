suite:
  id: ims_invite_content_type_test
  title: INVITE with random Content-Type header
  default_timeout_seconds: 3.0

tests:
  - id: invite_normal_with_test_content_type
    description: Send a normal INVITE message using Content-Type TEST
    message:
      type: INVITE
      template: |
        INVITE sip:alice@example.com SIP/2.0
        Via: SIP/2.0/UDP 192.0.2.100:5060;branch=z9hG4bK-invite-test-1
        Max-Forwards: 70
        From: <sip:bob@example.com>;tag=123456
        To: <sip:alice@example.com>
        Call-ID: invite-content-type-test-1@tester
        CSeq: 1 INVITE
        Contact: <sip:bob@192.0.2.100:5060>
        Content-Type: TEST
        Content-Length: 5

        HELLO

    expected_response:
      status_code: 100
