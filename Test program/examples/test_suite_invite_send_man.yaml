        CSeq: 595936382 INVITE
        Call-ID: 3817155854_2329272412@192.168.101.3
        Via: SIP/2.0/TCP 192.168.101.3:41067;branch=z9hG4bK3857861365
        Max-Forwards: 70
        Contact: <sip:966d2e53-8812-4e84-ada5-f8319bb853c4@192.168.101.3:41067>;+g.3gpp.icsi-ref="urn%3Aurn-7%3A3gpp-service.ims.icsi.mmtel";audio;+g.3gpp.nw-init-ussi;+g.3gpp.mid-call;+g.3gpp.srvcc-alerting;+g.3gpp.ps2cs-srvcc-orig-pre-alerting
