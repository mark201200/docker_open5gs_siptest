transport:
  name: kamailio-forward
  settings:
    pcscf_host: 172.22.0.21
    pcscf_port: 5060
    pcscf_transport: udp
    listen_host: 0.0.0.0
    listen_port: 0
    advertised_host: 192.168.1.223
    target_header: X-IMS-Tester-Target
    inject_via: true
    via_branch_prefix: z9hG4bK-ims-tester-
    default_target_port: 5060
    default_target_transport: udp
    max_buffered_responses: 32

# Example device target discovered from the environment.
# Add more devices as needed for your lab.
devices:
  - id: p1
    name: phone-1
    address: 192.168.101.6
    metadata:
      target_uri: sip:192.168.101.6:5060
      phone_number: "15551234567"
