suite:
  id: ims_invite_intercept_only_content_type_test
  title: Intercept-only INVITE rewrite to Content-Type TEST
  default_timeout_seconds: 30.0

tests:
  - id: invite_intercept_only_switch_content_type_to_test
    description: Wait for live INVITE traffic and rewrite Content-Type to TEST
    message:
      type: INVITE
      intercept_only: true
      intercept_message_type: INVITE
      intercept_direction: request
      intercept_wait_timeout_seconds: 30.0
      intercept_edits:
        - target: header
          action: set
          field: Content-Type
          value: application/sdpo
      repeat:
        count: 1
        rate_per_second: 1.0

    expected_response: {}
 