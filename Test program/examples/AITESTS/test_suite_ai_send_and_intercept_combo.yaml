suite:
  id: ai_send_and_intercept_combo
  title: AI combined send plus intercept mutation suite
  default_timeout_seconds: 12.0

tests:
  - id: ai_combo_send_invite_and_mutate_request_cl
    description: Send INVITE while intercept mutates request Content-Length to oversized value
    message:
      type: INVITE
      template: |
        INVITE tel:$PHONE;phone-context=ims.mnc001.mcc001.3gppnetwork.org SIP/2.0
        Via: SIP/2.0/UDP 192.0.2.100:5060;branch=z9hG4bK-ai-combo-1
        Max-Forwards: 70
        From: <sip:attacker@example.com>;tag=ai-combo-1
        To: <tel:$PHONE;phone-context=ims.mnc001.mcc001.3gppnetwork.org>
        Call-ID: ai-combo-1@tester
        CSeq: 1 INVITE
        Contact: <sip:attacker@192.0.2.100:5060>
        Content-Type: application/sdp
        Content-Length: 133

        v=0
        o=- 10 10 IN IP4 192.0.2.100
        s=AITESTS
        c=IN IP4 192.0.2.100
        t=0 0
        m=audio 49180 RTP/AVP 0
        a=rtpmap:0 PCMU/8000
      intercept_message_type: INVITE
      intercept_direction: request
      intercept_edits:
        - target: header
          action: set
          field: Content-Length
          value: 9999
      repeat:
        count: 1
        rate_per_second: 1.0
    expected_response: {}

  - id: ai_combo_send_invite_and_mutate_response_status
    description: Send INVITE while intercept mutates response status line to unusual value
    message:
      type: INVITE
      template: |
        INVITE tel:$PHONE;phone-context=ims.mnc001.mcc001.3gppnetwork.org SIP/2.0
        Via: SIP/2.0/UDP 192.0.2.100:5060;branch=z9hG4bK-ai-combo-2
        Max-Forwards: 70
        From: <sip:attacker@example.com>;tag=ai-combo-2
        To: <tel:$PHONE;phone-context=ims.mnc001.mcc001.3gppnetwork.org>
        Call-ID: ai-combo-2@tester
        CSeq: 2 INVITE
        Contact: <sip:attacker@192.0.2.100:5060>
        Content-Type: application/sdp
        Content-Length: 133

        v=0
        o=- 11 11 IN IP4 192.0.2.100
        s=AITESTS
        c=IN IP4 192.0.2.100
        t=0 0
        m=audio 49182 RTP/AVP 0
        a=rtpmap:0 PCMU/8000
      intercept_message_type: INVITE
      intercept_direction: response
      intercept_edits:
        - target: start_line
          action: set
          value: SIP/2.0 699 Weird-Response
      repeat:
        count: 1
        rate_per_second: 1.0
    expected_response: {}

  - id: ai_combo_send_options_and_strip_via
    description: Send OPTIONS while intercept removes Via from request to induce protocol rejection
    message:
      type: OPTIONS
      template: |
        OPTIONS sip:$PHONE@ims.mnc001.mcc001.3gppnetwork.org SIP/2.0
        Via: SIP/2.0/UDP 192.0.2.100:5060;branch=z9hG4bK-ai-combo-3
        Max-Forwards: 70
        From: <sip:attacker@example.com>;tag=ai-combo-3
        To: <sip:$PHONE@ims.mnc001.mcc001.3gppnetwork.org>
        Call-ID: ai-combo-3@tester
        CSeq: 3 OPTIONS
        Contact: <sip:attacker@192.0.2.100:5060>
        Content-Length: 0
      intercept_message_type: OPTIONS
      intercept_direction: request
      intercept_edits:
        - target: header
          action: remove
          field: Via
      repeat:
        count: 3
        rate_per_second: 2.0
    expected_response: {}
