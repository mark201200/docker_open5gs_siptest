[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ims-thesis-tester"
version = "0.1.0"
description = "Interface-first CLI for IMS smartphone SIP conformance and differential testing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
]

[project.scripts]
ims-tester = "ims_tester.cli:main"
