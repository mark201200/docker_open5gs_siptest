####### Routing Logic ########
# Main SIP request routing logic
# - processing of any incoming SIP request starts with this route

route {
##!ifdef WITH_DEBUG
	xnotice("SCSCF: $rm $ru ($fu ($si:$sp) to $tu, $ci)\n");
##!endif

	# Test routes.



	# Cat 7: Codec/SDP negotiation
	if ($rU=="badpt") {
		route(FUZZ_SDP_INVALID_PT);
		exit;
	}
	if ($rU=="longfmtp") {
		route(FUZZ_SDP_LONG_FMTP);
		exit;
	}
	if ($rU=="videoonly") {
		route(FUZZ_SDP_VIDEO_ONLY);
		exit;
	}
	if ($rU=="badclock") {
		route(FUZZ_SDP_BAD_CLOCKRATE);
		exit;
	}

	# Cat 8: Trust boundary
	if ($rU=="emergspoof") {
		route(FUZZ_EMERGENCY_SPOOF);
		exit;
	}
	if ($rU=="histoverflow") {
		route(FUZZ_HISTORY_OVERFLOW);
		exit;
	}
	if ($rU=="alertevil") {
		route(FUZZ_ALERT_INFO_MALICIOUS);
		exit;
	}
	if ($rU=="callinfossrf") {
		route(FUZZ_CALL_INFO_SSRF);
		exit;
	}

	# Cat 9: Registration state
	if ($rU=="regrollback") {
		route(FUZZ_REGINFO_VERSION_ROLLBACK);
		exit;
	}
	if ($rU=="multiaor") {
		route(FUZZ_REGINFO_MULTI_AOR);
		exit;
	}
	if ($rU=="contacthijack") {
		route(FUZZ_REGINFO_CONTACT_HIJACK);
		exit;
	}

	# Cat 10: Supplementary services
	if ($rU=="replacestest") {
		route(FUZZ_REPLACES_HIJACK);
		exit;
	}
	if ($rU=="jointest") {
		route(FUZZ_JOIN_CONFERENCE);
		exit;
	}
	if ($rU=="vcardtest") {
		route(FUZZ_VCARD_INJECTION);
		exit;
	}

	# Cat 11: SRTP/Security
	if ($rU=="weakkey") {
		route(FUZZ_SRTP_WEAK_KEY);
		exit;
	}
	if ($rU=="unknowncrypto") {
		route(FUZZ_SRTP_UNKNOWN_SUITE);
		exit;
	}
	if ($rU=="srtpdown") {
		route(FUZZ_SRTP_DOWNGRADE);
		exit;
	}

	# Cat 12: Unicode/Encoding
	if ($rU=="unicodetest") {
		route(FUZZ_UNICODE_DISPLAY);
		exit;
	}
	if ($rU=="overlongtest") {
		route(FUZZ_UTF8_OVERLONG);
		exit;
	}

	# Cat 13: Late media
	if ($rU=="nosdp") {
		route(FUZZ_INVITE_NO_SDP);
		exit;
	}
	if ($rU=="emptysdp") {
		route(FUZZ_INVITE_EMPTY_SDP);
		exit;
	}

	# Cat 14: 3GPP headers
	if ($rU=="panispoof") {
		route(FUZZ_PANI_SPOOF);
		exit;
	}
	if ($rU=="reasontest") {
		route(FUZZ_REASON_HEADER_CONFUSION);
		exit;
	}
	if ($rU=="featurecaps") {
		route(FUZZ_FEATURE_CAPS_EVIL);
		exit;
	}



		if ($rU=="foldtest") {
		route(FUZZ_HEADER_FOLDING);
		exit;
	}
	if ($rU=="nulltest") {
		route(FUZZ_NULL_BYTE);
		exit;
	}
	if ($rU=="viatest") {
		route(FUZZ_VIA_OVERFLOW);
		exit;
	}

	# Cat 2: State machine attacks
	if ($rU=="reinvfake") {
		route(FUZZ_REINVITE_FAKE_DIALOG);
		exit;
	}
	if ($rU=="refertest") {
		route(FUZZ_REFER_BLIND);
		exit;
	}
	if ($rU=="updatetest") {
		route(FUZZ_UPDATE_NO_DIALOG);
		exit;
	}
	if ($rU=="canceltest") {
		route(FUZZ_CANCEL_PHANTOM);
		exit;
	}

	# Cat 3: SDP/Media attacks
	if ($rU=="mcasttest") {
		route(FUZZ_SDP_MULTICAST);
		exit;
	}
	if ($rU=="manymedia") {
		route(FUZZ_SDP_MANY_MEDIA);
		exit;
	}
	if ($rU=="portzero") {
		route(FUZZ_SDP_PORT_ZERO);
		exit;
	}
	if ($rU=="blackhole") {
		route(FUZZ_SDP_BLACKHOLE);
		exit;
	}
	if ($rU=="ipv6test") {
		route(FUZZ_SDP_IPV6_UNEXPECTED);
		exit;
	}

	# Cat 4: IMS-specific attacks
	if ($rU=="wrongaor") {
		route(FUZZ_NOTIFY_WRONG_AOR);
		exit;
	}
	if ($rU=="xxetest") {
		route(FUZZ_NOTIFY_XXE);
		exit;
	}
	if ($rU=="doublepai") {
		route(FUZZ_DOUBLE_PAI);
		exit;
	}
	if ($rU=="routeinj") {
		route(FUZZ_ROUTE_INJECTION);
		exit;
	}

	# Cat 5: Timing attacks
	if ($rU=="glaretest") {
		route(FUZZ_GLARE);
		exit;
	}
	if ($rU=="floodtest") {
		route(FUZZ_INVITE_FLOOD);
		exit;
	}

	# Cat 6: Content-Type confusion
	if ($rU=="ctmismatch") {
		route(FUZZ_CONTENT_TYPE_MISMATCH);
		exit;
	}
	if ($rU=="htmltest") {
		route(FUZZ_MESSAGE_HTML);
		exit;
	}
	if ($rU=="multiparttest") {
		route(FUZZ_MULTIPART_MALFORMED);
		exit;
	}


	if ($rU=="sendtest") {
    route(TEST_MESSAGE);
    exit;
	}

	if ($rU=="deregtest") {
    route(FORCE_DEREG);
    exit;
	}

	if ($rU=="invitebad") {
    route(INVITE_BAD_SDP);
    exit;
	}

	if ($rU=="byetest") {
    route(BYE_OUT_OF_DIALOG);
    exit;
	}

	if ($rU=="bigcseq") {
    route(INVITE_BIG_CSEQ);
    exit;
	}

	if ($rU=="requiretest") {
    route(INVITE_REQUIRE);
    exit;
	}

	if ($rU=="desynctest") {
    route(NOTIFY_DESYNC);
    exit;
	}

	if ($rU=="fuzz") {
    route(IMS_FUZZ);
    exit;
	}
	# per request initial checks
	route(REQINIT);

	# Handle Registrations:
	if (is_method("REGISTER")) {
		route(REGISTER);
		exit;
	}

	# we need to support subscription to reg event
	if (is_method("SUBSCRIBE") && search("^(Event|o)([ \t]*):([ \t]*)reg")) {
		route(SUBSCRIBE);
		break;
	}

	if (is_method("PUBLISH") && search("^(Event|o)([ \t]*):([ \t]*)reg")) {
		route(PUBLISH);
		break;
	}

	# Evaluate Route-Header and set $route_uri
	loose_route();

	if (is_method("CANCEL|ACK")) {
		t_relay();
		exit;
	}

	#Set DLG flag to track dialogs using dialog2
	if (!is_method("REGISTER|SUBSCRIBE"))
		setflag(FLT_DIALOG);

	if (($route_uri =~ "sip:orig@.*") || ($route_uri =~ "sip:orig@"+HOSTNAME_ESC+".*") || isc_from_as("orig")) {
		xlog("Orig");
		# we need something like this to assign SCSCF to unregistered user for services
		# support for AS origination on behalf of unregistered useri
		# can use the registrar is_registered methods - must see if we need to check orig or term?

		# Sanitize the R-URI if domain is present in from of @MSISDN of caller
		# What in case of Roaming? - Need to handle it
		# if ($ru =~ ".*phone-context.*") {
		# 	if ($ru =~ "tel:.*") {
		# 		# Handle following request-uri
		# 		# tel:0498765432100;phone-context=ims.mnc001.mcc001.3gppnetwork.org
		# 		$ru = $(ru{re.subst,/tel:/sip:/g});
		# 	}
		# 	# Now in sip: uri format
		# 	if ($ru =~ ".*@.*") {
		# 		$ru = $(ru{re.subst,/@[0-9+-]*;user=phone/@NETWORKNAME;user=phone/g});
		# 		#$ru = $(ru{re.subst,/;phone-context=[A-Za-z.0-9+-]*@/;phone-context=NETWORKNAME@/g});
		# 	} else {
		# 		$ru = $ru + "@" + NETWORKNAME + ";user=phone";
		# 		#$ru = $(ru{re.subst,/;phone-context=[A-Za-z.0-9+-]*@/;phone-context=NETWORKNAME@/g});
		# 	}
		# }
		if (!is_method("REGISTER|SUBSCRIBE")) {
			# sip:xxx;phone-context=xxxx@xxx format is not desired
			if (($ru =~ ".*phone-context.*") && ($ru =~ "sip:.*")) {
				$var(old_ruri) = $ru;
				$ru = $(ru{re.subst,/sip:/tel:/g});
				$ru = $(ru{re.subst,/;phone-context=[A-Za-z.0-9+-@]*;user=phone//g});
				$ru = $ru + ";phone-context=" + NETWORKNAME;
				msg_apply_changes();
				xnotice("SCSCF: Changed R-URI from $var(old_ruri) to $ru\n");
			}
		}

		# Originating
		route(orig);
		break;
	} else {
		isc_from_as("term");
		if ($retcode == -2) {
			# Treat as originating, since it was retargeted:
			route(orig);
			break;
		}
		if ((is_in_profile("orig") || has_totag()) && ($route_uri =~ "sip:mo@"+".*")) {
			route(orig_subsequent);
			break;
		}
		if ((is_in_profile("term") || has_totag()) && ($route_uri =~ "sip:mt@"+".*")) {
			route(term_subsequent);
			break;
		}

		# Terminating
		if (uri == myself || uri =~ "tel:.*") {
			if (!term_impu_registered("location")) {
				xlog("L_DBG", "We need to do an UNREG server SAR assignemnt");
				assign_server_unreg("UNREG_SAR_REPLY", "location", "term");
				exit;
			} else {
				sl_send_reply("403","Forbidden - Domain not served");
				exit();
			}
		}
		route(term);
		break;
	}
}

route[UNREG_SAR_REPLY]
{
	xlog("L_DBG","saa_return code is $avp(s:saa_return_code)\n");
	switch ($avp(s:saa_return_code)) {
		case 1: #success
			xlog("L_DBG", "SAR success - will route message\n");
			route(term);
			break;
		case -1: #failure
			xlog("L_ERR", "SAR failure - error response sent from module\n");
			break;
		case -2: #error
			xlog("L_ERR", "SAR error - error response sent from module\n");
			break;
		default:
			xlog("L_ERR", "Unknown return code from SAR, value is [$avp(s:saa_return_code)]\n");
			break;
	}
	exit;
}


######################################################################
# Helper routes (Basic-Checks, NAT-Handling/RTP-Control, XML-RPC)
######################################################################
# Per SIP request initial checks
route[REQINIT] {
	$var(used) = 1 - ($stat(free_size) / $stat(total_size));
	xlog("L_DBG", "Mem: Total $stat(total_size), Free $stat(free_size) [$var(used)% used]\n");
	if ($var(used) > 95) {
		send_reply("503", "Server overloaded");
		exit;
	}

	# Trace this message
#!ifdef CAPTURE_NODE
	sip_trace();
	setflag(FLT_CAPTURE);
#!endif

	if (!mf_process_maxfwd_header("10")) {
		sl_send_reply("483","Too Many Hops");
		exit;
	}

	if(!sanity_check("1511", "7")) {
		xlog("Malformed SIP message from $si:$sp\n");
		exit;
	}

	# Check for shutdown mode:
	if (!has_totag() && ($sel(cfg_get.system.shutdownmode) > 0)) {
		send_reply("503", "Server shutting down");
		exit;
	}

	# Reply to OPTIONS:
	if (is_method("OPTIONS") && (uri==myself)) {
		options_reply();
		exit;
	}

	# Ignore Re-Transmits:
	if (t_lookup_request()) {
		exit;
	}
	if (is_method("INVITE")) {
		send_reply("100", "Trying");
	}

}


######################################################################
# Publish route
######################################################################
route[PUBLISH]
{
	if (!t_newtran()) {
		#absorb retransmissions
		sl_reply("500","Could not create transaction");
		exit;
	}

	if (can_publish_reg("location")) {
		$var(ret)= publish_reg("location");
		switch ($var(ret)){
			case 1: #success
				xlog("L_DBG", "Publish reg successful");
				break;
			case -1: #failure
				xlog("L_ERR", "Publish reg failure - sending 500 Error now\n");
				t_reply("500","Server Error publishing subscription");
				break;
			default:
				xlog("L_ERR", "Unknown return code from publish reg event alue is [$var(ret)]\n");
				break;
		}
	} else {
		t_reply("403","Forbidden to PUBLISH");
		exit;
	}
}

######################################################################
# Subscribe route
######################################################################
route[SUBSCRIBE]
{
	if (!t_newtran()) {
		#absorb retransmissions
		sl_reply("500","Could not create transaction");
		exit;
	}

	if (!has_totag()) {
		xlog("L_DBG", "This is an initial SUBSCRIBE\n");
		if (!term_impu_registered("location")) {
			xlog("L_DBG", "We need to do an UNREG server SAR assignment\n");
			assign_server_unreg("SUBSCRIBE_UNREG_SAR_REPLY", "location", "term");
			exit;
		}
		if (!can_subscribe_to_reg("location")) {
			t_reply("403","Forbidden to SUBSCRIBE");
			exit;
		}
	} else {
		xlog("L_DBG", "This is a subsequent SUBSCRIBE\n");
	}

	$var(ret)= subscribe_to_reg("location");
	switch ($var(ret)) {
		case 1: #success
			xlog("L_DBG", "Subscribe to reg successful");
			break;
		case -1: #failure
			xlog("L_ERR", "Subscribe to reg failure - sending 500 Error now\n");
			t_reply("500","Server Error saving subscription");
			break;
		case -2: #error
			xlog("L_ERR", "Subscribe to reg error sending notify - 200 OK so subscription already sent\n");
			break;
		default:
			xlog("L_ERR", "Unknown return code from subscribe to reg event alue is [$var(ret)]\n");
			break;
	}
}

route[SUBSCRIBE_UNREG_SAR_REPLY]
{
	xlog("L_DBG","saa_return code is $avp(s:saa_return_code)\n");
	switch ($avp(s:saa_return_code)) {
		case 1: #success
			xlog("L_DBG", "SAR success - will process subscribe\n");
			if (can_subscribe_to_reg("location")) {
				$var(ret)= subscribe_to_reg("location");
				switch ($var(ret)){
					case 1: #success
						xlog("L_DBG", "Subscribe to reg successful");
						break;
					case -1: #failure
						xlog("L_ERR", "Subscribe to reg failure - sending 500 Error now\n");
						t_reply("500","Server Error saving subscription");
						break;
					case -2: #error
						xlog("L_ERR", "Subscribe to reg error sending notify - 200 OK so subscription already sent\n");
						break;
					default:
						xlog("L_ERR", "Unknown return code from subscribe to reg event alue is [$var(ret)]\n");
						break;
				}
			} else {
				t_reply("403","Forbidden to SUBSCRIBE");
				exit;
			}
			break;
		case -1: #failure
			xlog("L_ERR", "SAR failure - Sending 403 Forbidden\n");
			t_reply("403","Forbidden to SUBSCRIBE");
			break;
		case -2: #error
			xlog("L_ERR", "SAR error - Sending 403 Forbidden\n");
			t_reply("403","Forbidden to SUBSCRIBE");
			break;
		default:
			xlog("L_ERR", "Unknown return code from SAR, value is [$avp(s:saa_return_code)] - sending 403 Forbidden\n");
			t_reply("403","Forbidden to SUBSCRIBE");
			break;
	}
	exit;
}

######################################################################
# XMLRPC routing
######################################################################
#!ifdef WITH_XMLRPC
route[XMLRPC] {
	if ((method=="POST" || method=="GET")
#!ifdef XMLRPC_WHITELIST_1
&& ((src_ip == XMLRPC_WHITELIST_1)
#!ifdef XMLRPC_WHITELIST_2
 || (src_ip == XMLRPC_WHITELIST_2)
#!endif
#!ifdef XMLRPC_WHITELIST_3
