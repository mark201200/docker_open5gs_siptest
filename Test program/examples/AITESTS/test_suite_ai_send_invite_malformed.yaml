suite:
  id: ai_send_invite_malformed_matrix
  title: AI malformed INVITE send matrix
  default_timeout_seconds: 8.0

tests:
  - id: ai_invite_invalid_sip_version
    description: Send INVITE with malformed but routable headers so packet still traverses toward device
    message:
      type: INVITE
      template: |
        INVITE sip:placeholder@example.com SIP/2.0
        From: <sip:9076543211@ims.mnc001.mcc001.3gppnetwork.org>;tag=ai-inv-1
        To: <sip:placeholder@example.com>
        CSeq: 595936381 INVITE
        Call-ID: ai-inv-1_2329272412@192.168.101.3
        Via: SIP/2.0/TCP 192.168.101.3:41067;branch=z9hG4bK-ai-inv-1
        Max-Forwards: 70
        Contact: <sip:966d2e53-8812-4e84-ada5-f8319bb853c4@192.168.101.3:41067>;+g.3gpp.icsi-ref="urn%3Aurn-7%3A3gpp-service.ims.icsi.mmtel";audio
        Route: <sip:172.22.0.21:6101;lr>,<sip:orig@scscf.ims.mnc001.mcc001.3gppnetwork.org:6060;lr>
        P-Access-Network-Info: 3GPP-E-UTRAN-FDD; utran-cell-id-3gpp=0010100010019B01
        Security-Verify: ipsec-3gpp;q=0.1;prot=esp;mod=trans;spi-c=4098;spi-s=4099;port-c=5101;port-s=6101;alg=hmac-sha-1-96;ealg=null
        Proxy-Require: sec-agree
        Require: sec-agree
        P-Preferred-Identity: <sip:9076543211@ims.mnc001.mcc001.3gppnetwork.org>
        Allow: INVITE,ACK,CANCEL,BYE,UPDATE,PRACK,MESSAGE,REFER,NOTIFY,INFO,OPTIONS
        Content-Type: application/sdp
        Content-Length: 133

        v=0
        o=- 1 1 IN IP4 192.0.2.100
        s=AITESTS
        c=IN IP4 192.0.2.100
        t=0 0
        m=audio 49170 RTP/AVP 0
        a=rtpmap:0 PCMU/8000
      edits:
        - target: start_line
          action: set
          value: INVITE tel:$PHONE;phone-context=ims.mnc001.mcc001.3gppnetwork.org SIP/2.0
        - target: header
          action: set
          field: To
          value: <tel:$PHONE;phone-context=ims.mnc001.mcc001.3gppnetwork.org>
        - target: header
          action: set
          field: Content-Type
          value: application/sdp-bad-token
        - target: header
          action: append
          field: X-AI-Malformed
          value: case1-routable-malformed
      repeat:
        count: 1
        rate_per_second: 1.0
    expected_response:
      header_contains:
        Via: SIP/2.0
        CSeq: INVITE

  - id: ai_invite_duplicate_conflicting_content_length
    description: Send INVITE with malformed URI/headers while preserving parser compatibility
    message:
      type: INVITE
      template: |
        INVITE tel:$PHONE;phone-context=ims.mnc001.mcc001.3gppnetwork.org SIP/2.0
        From: <sip:9076543211@ims.mnc001.mcc001.3gppnetwork.org>;tag=ai-inv-2
        To: <tel:$PHONE;phone-context=ims.mnc001.mcc001.3gppnetwork.org>
        CSeq: 595936382 INVITE
        Call-ID: ai-inv-2_2329272412@192.168.101.3
        Via: SIP/2.0/TCP 192.168.101.3:41067;branch=z9hG4bK-ai-inv-2
        Max-Forwards: 70
        Contact: <sip:966d2e53-8812-4e84-ada5-f8319bb853c4@192.168.101.3:41067>;+g.3gpp.icsi-ref="urn%3Aurn-7%3A3gpp-service.ims.icsi.mmtel";audio
        Route: <sip:172.22.0.21:6101;lr>,<sip:orig@scscf.ims.mnc001.mcc001.3gppnetwork.org:6060;lr>
        P-Access-Network-Info: 3GPP-E-UTRAN-FDD; utran-cell-id-3gpp=0010100010019B01
        Security-Verify: ipsec-3gpp;q=0.1;prot=esp;mod=trans;spi-c=4098;spi-s=4099;port-c=5101;port-s=6101;alg=hmac-sha-1-96;ealg=null
        Proxy-Require: sec-agree
        Require: sec-agree
        P-Preferred-Identity: <sip:9076543211@ims.mnc001.mcc001.3gppnetwork.org>
        Allow: INVITE,ACK,CANCEL,BYE,UPDATE,PRACK,MESSAGE,REFER,NOTIFY,INFO,OPTIONS
        Content-Type: application/sdp
        Content-Length: 133

        v=0
        o=- 2 2 IN IP4 192.0.2.100
        s=AITESTS
        c=IN IP4 192.0.2.100
        t=0 0
        m=audio 49172 RTP/AVP 0
        a=rtpmap:0 PCMU/8000
      edits:
        - target: header
          action: set
          field: From
          value: <sip:9076543211@@ims.mnc001.mcc001.3gppnetwork.org>;tag=ai-inv-2
        - target: header
          action: append
          field: Contact
          value: <sip:broken-contact@@192.168.101.3:41067>
      repeat:
        count: 1
        rate_per_second: 1.0
    expected_response:
      header_contains:
        Via: SIP/2.0
        CSeq: INVITE

  - id: ai_invite_negative_max_forwards_bad_cseq
    description: Send INVITE with non-fatal protocol anomalies expected to still route toward target
    message:
      type: INVITE
      template: |
        INVITE tel:$PHONE;phone-context=ims.mnc001.mcc001.3gppnetwork.org SIP/2.0
        From: <sip:9076543211@ims.mnc001.mcc001.3gppnetwork.org>;tag=ai-inv-3
        To: <tel:$PHONE;phone-context=ims.mnc001.mcc001.3gppnetwork.org>
        CSeq: 595936383 INVITE
        Call-ID: ai-inv-3_2329272412@192.168.101.3
        Via: SIP/2.0/TCP 192.168.101.3:41067;branch=z9hG4bK-ai-inv-3
        Max-Forwards: 70
        Contact: <sip:966d2e53-8812-4e84-ada5-f8319bb853c4@192.168.101.3:41067>;+g.3gpp.icsi-ref="urn%3Aurn-7%3A3gpp-service.ims.icsi.mmtel";audio
        Route: <sip:172.22.0.21:6101;lr>,<sip:orig@scscf.ims.mnc001.mcc001.3gppnetwork.org:6060;lr>
        P-Access-Network-Info: 3GPP-E-UTRAN-FDD; utran-cell-id-3gpp=0010100010019B01
        Security-Verify: ipsec-3gpp;q=0.1;prot=esp;mod=trans;spi-c=4098;spi-s=4099;port-c=5101;port-s=6101;alg=hmac-sha-1-96;ealg=null
        Proxy-Require: sec-agree
        Require: sec-agree
        P-Preferred-Identity: <sip:9076543211@ims.mnc001.mcc001.3gppnetwork.org>
        Allow: INVITE,ACK,CANCEL,BYE,UPDATE,PRACK,MESSAGE,REFER,NOTIFY,INFO,OPTIONS
        Content-Type: application/sdp
        Content-Length: 133

        v=0
        o=- 3 3 IN IP4 192.0.2.100
        s=AITESTS
        c=IN IP4 192.0.2.100
        t=0 0
        m=audio 49174 RTP/AVP 0
        a=rtpmap:0 PCMU/8000
      edits:
        - target: header
          action: set
          field: Max-Forwards
          value: 69
        - target: header
          action: set
          field: CSeq
          value: 595936383 INVITE
        - target: header
          action: append
          field: X-AI-Malformed
          value: case3-low-max-forwards
      repeat:
        count: 1
        rate_per_second: 1.0
    expected_response:
      header_contains:
        Via: SIP/2.0
        CSeq: INVITE

  - id: ai_invite_burst_header_flood
    description: High repetition malformed INVITE burst with valid IMS identity/routing headers
    message:
      type: INVITE
      template: |
        INVITE tel:$PHONE;phone-context=ims.mnc001.mcc001.3gppnetwork.org SIP/2.0
        From: <sip:9076543211@ims.mnc001.mcc001.3gppnetwork.org>;tag=ai-inv-4
        To: <tel:$PHONE;phone-context=ims.mnc001.mcc001.3gppnetwork.org>
        CSeq: 595936384 INVITE
        Call-ID: ai-inv-4_2329272412@192.168.101.3
        Via: SIP/2.0/TCP 192.168.101.3:41067;branch=z9hG4bK-ai-inv-4
        Max-Forwards: 70
        Contact: <sip:966d2e53-8812-4e84-ada5-f8319bb853c4@192.168.101.3:41067>;+g.3gpp.icsi-ref="urn%3Aurn-7%3A3gpp-service.ims.icsi.mmtel";audio
        Route: <sip:172.22.0.21:6101;lr>,<sip:orig@scscf.ims.mnc001.mcc001.3gppnetwork.org:6060;lr>
        P-Access-Network-Info: 3GPP-E-UTRAN-FDD; utran-cell-id-3gpp=0010100010019B01
        Security-Verify: ipsec-3gpp;q=0.1;prot=esp;mod=trans;spi-c=4098;spi-s=4099;port-c=5101;port-s=6101;alg=hmac-sha-1-96;ealg=null
        Proxy-Require: sec-agree
        Require: sec-agree
        P-Preferred-Identity: <sip:9076543211@ims.mnc001.mcc001.3gppnetwork.org>
        Allow: INVITE,ACK,CANCEL,BYE,UPDATE,PRACK,MESSAGE,REFER,NOTIFY,INFO,OPTIONS
        X-AI-Fuzz: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        Content-Type: text/plain
        Content-Length: 256

        FUZZFUZZFUZZFUZZFUZZFUZZFUZZFUZZFUZZFUZZFUZZFUZZFUZZFUZZFUZZFUZZFUZZFUZZFUZZFUZZFUZZFUZZFUZZFUZZFUZZFUZZFUZZFUZZFUZZFUZZFUZZFUZZ
      repeat:
        count: 1
        rate_per_second: 5.0
    expected_response:
