suite:
  id: ims_invite_rfc_wrong_content_type_token
  title: INVITE RFC robustness - wrong Content-Type token
  default_timeout_seconds: 6.0

tests:
  - id: invite_wrong_content_type_token
    description: Send INVITE with non-RFC Content-Type token while keeping SDP-like body
    message:
      type: INVITE
      template: |
        INVITE sip:alice@example.com SIP/2.0
        Via: SIP/2.0/UDP 192.0.2.100:5060;branch=z9hG4bK-rfc-ct-1
        Max-Forwards: 70
        From: <sip:bob@example.com>;tag=robust-ct
        To: <sip:alice@example.com>
        Call-ID: rfc-ct-1@tester
        CSeq: 1 INVITE
        Contact: <sip:bob@192.0.2.100:5060>
        Content-Type: TEST
        Content-Length: 133

        v=0
        o=- 1 1 IN IP4 192.0.2.100
        s=IMS-Robustness
        c=IN IP4 192.0.2.100
        t=0 0
        m=audio 49170 RTP/AVP 0
        a=rtpmap:0 PCMU/8000
      repeat:
        count: 1
        rate_per_second: 1.0

    expected_response: {}