suite:
  id: ims_invite_rfc_malformed_from_uri
  title: INVITE RFC robustness - malformed From URI
  default_timeout_seconds: 6.0

tests:
  - id: invite_malformed_from_uri
    description: Remove URI scheme from From header to break SIP URI grammar
    message:
      type: INVITE
      template: |
        INVITE tel:9076543210;phone-context=ims.mnc001.mcc001.3gppnetwork.org SIP/2.0
        Via: SIP/2.0/UDP 192.0.2.100:5060;branch=z9hG4bK-rfc-from-1
        Max-Forwards: 70
        From: <sip:bob@example.com>;tag=robust-from
        To: <sip:alice@example.com>
        Call-ID: rfc-from-1@tester
        CSeq: 1 INVITE
        Contact: <sip:bob@192.0.2.100:5060>
        Content-Type: application/sdp
        Content-Length: 133

        v=0
        o=- 7 7 IN IP4 192.0.2.100
        s=IMS-Robustness
        c=IN IP4 192.0.2.100
        t=0 0
        m=audio 49170 RTP/AVP 0
        a=rtpmap:0 PCMU/8000
      edits:
        - target: header
          action: set
          field: From
          value: <bob@example.com>;tag=robust-from
      repeat:
        count: 1
        rate_per_second: 1.0

    expected_response: {}
