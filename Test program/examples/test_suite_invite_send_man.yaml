    message:
      type: INVITE
      template: |
        INVITE tel:9076543210;phone-context=ims.mnc001.mcc001.3gppnetwork.org SIP/2.0
        From: <sip:9076543211@ims.mnc001.mcc001.3gppnetwork.org>;tag=3817158864
